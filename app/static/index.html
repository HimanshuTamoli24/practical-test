<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LinkLens — AI website analysis</title>
    <meta
      name="description"
      content="Analyze any website with Groq: competitors, search queries, SEO, services and target audience."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23000'/%3E%3Cpath d='M8 15.5 12 8l4 7.5' stroke='%23fff' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg: #ffffff;
        --bg-soft: #fafafa;
        --panel: #ffffff;
        --fg: #0a0a0a;
        --fg-soft: #666666;
        --fg-faint: #8f8f8f;
        --border: #eaeaea;
        --border-strong: #d6d6d6;
        --accent: #000000;
        --accent-fg: #ffffff;
        --blue: #0070f3;
        --green: #0f7b3f;
        --green-soft: #e8f7ee;
        --red: #d92d20;
        --red-soft: #fef3f2;
        --amber: #b45309;
        --amber-soft: #fffbeb;
        --radius: 10px;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.04);
        --font:
          "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        --mono:
          ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono",
          monospace;
        --max: 1040px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --bg-soft: #0a0a0a;
          --panel: #0c0c0c;
          --fg: #ededed;
          --fg-soft: #a1a1a1;
          --fg-faint: #767676;
          --border: #1f1f1f;
          --border-strong: #333333;
          --accent: #ffffff;
          --accent-fg: #000000;
          --blue: #52a8ff;
          --green: #4ade80;
          --green-soft: #07200f;
          --red: #ff6b6b;
          --red-soft: #2a0b0b;
          --amber: #fbbf24;
          --amber-soft: #241a05;
          --shadow:
            0 1px 2px rgba(0, 0, 0, 0.5), 0 8px 24px rgba(0, 0, 0, 0.35);
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      a {
        color: inherit;
      }
      button,
      input {
        font-family: inherit;
      }
      .wrap {
        width: 100%;
        max-width: var(--max);
        margin: 0 auto;
        padding: 0 24px;
      }
      .hidden {
        display: none !important;
      }

      /* ---------- nav ---------- */
      header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        backdrop-filter: saturate(180%) blur(12px);
        border-bottom: 1px solid var(--border);
      }
      .nav {
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-weight: 600;
        letter-spacing: -0.01em;
        text-decoration: none;
        font-size: 15px;
      }
      .brand svg {
        display: block;
      }
      .nav-links {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .nav-link {
        text-decoration: none;
        color: var(--fg-soft);
        font-size: 13px;
        padding: 6px 10px;
        border-radius: 7px;
        transition:
          color 0.15s,
          background 0.15s;
      }
      .nav-link:hover {
        color: var(--fg);
        background: var(--bg-soft);
      }
      .nav-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--fg-soft);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 4px 10px;
        white-space: nowrap;
      }
      .nav-pill .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
      }

      /* ---------- hero ---------- */
      .hero {
        position: relative;
        padding: 72px 0 20px;
        text-align: center;
        overflow: hidden;
      }
      .hero::before {
        content: "";
        position: absolute;
        inset: -30% 0 auto;
        height: 420px;
        background: radial-gradient(
          60% 100% at 50% 0%,
          color-mix(in srgb, var(--fg) 6%, transparent),
          transparent 70%
        );
        pointer-events: none;
      }
      .hero > * {
        position: relative;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--border);
        background: var(--bg-soft);
        color: var(--fg-soft);
        font-size: 12px;
        border-radius: 999px;
        padding: 5px 12px;
        margin-bottom: 22px;
      }
      .badge .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 0 3px var(--green-soft);
      }
      h1 {
        font-size: clamp(34px, 6vw, 56px);
        line-height: 1.04;
        letter-spacing: -0.045em;
        font-weight: 650;
        margin: 0 auto 18px;
        max-width: 720px;
      }
      h1 .muted {
        color: var(--fg-faint);
      }
      .lede {
        max-width: 560px;
        margin: 0 auto 32px;
        color: var(--fg-soft);
        font-size: 16px;
      }

      /* ---------- search ---------- */
      form.search {
        display: flex;
        gap: 8px;
        max-width: 640px;
        margin: 0 auto;
        padding: 6px;
        border: 1px solid var(--border-strong);
        border-radius: 12px;
        background: var(--panel);
        box-shadow: var(--shadow);
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      form.search:focus-within {
        border-color: var(--fg-faint);
      }
      .field {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        min-width: 0;
        padding-left: 10px;
      }
      .field svg {
        flex: none;
        color: var(--fg-faint);
      }
      .field input {
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--fg);
        font-size: 15px;
        padding: 10px 0;
      }
      .field input::placeholder {
        color: var(--fg-faint);
      }
      button.primary {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 0;
        background: var(--accent);
        color: var(--accent-fg);
        font-size: 14px;
        font-weight: 550;
        padding: 0 18px;
        height: 42px;
        border-radius: 8px;
        cursor: pointer;
        white-space: nowrap;
        transition:
          opacity 0.15s,
          transform 0.05s;
      }
      button.primary:hover {
        opacity: 0.88;
      }
      button.primary:active {
        transform: translateY(1px);
      }
      button.primary:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .examples {
        margin: 16px 0 0;
        font-size: 12px;
        color: var(--fg-faint);
      }
      .examples button {
        border: 0;
        background: none;
        color: var(--fg-soft);
        font-size: 12px;
        cursor: pointer;
        padding: 2px 4px;
        text-decoration: underline;
        text-decoration-color: var(--border-strong);
        text-underline-offset: 3px;
      }
      .examples button:hover {
        color: var(--fg);
      }

      .alert {
        max-width: 640px;
        margin: 20px auto 0;
        text-align: left;
        display: flex;
        gap: 10px;
        border: 1px solid color-mix(in srgb, var(--amber) 35%, var(--border));
        background: var(--amber-soft);
        color: var(--amber);
        border-radius: var(--radius);
        padding: 12px 14px;
        font-size: 13px;
      }
      .alert code {
        font-family: var(--mono);
        font-size: 12px;
      }

      /* ---------- status / error ---------- */
      .status-card,
      .error-card {
        max-width: 640px;
        margin: 40px auto 0;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--panel);
        padding: 18px;
        display: flex;
        gap: 14px;
        align-items: flex-start;
        box-shadow: var(--shadow);
      }
      .spinner {
        flex: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid var(--border);
        border-top-color: var(--fg);
        animation: spin 0.8s linear infinite;
        margin-top: 2px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .status-card strong {
        display: block;
        font-size: 14px;
        font-weight: 550;
      }
      .status-card p {
        margin: 2px 0 0;
        font-size: 13px;
        color: var(--fg-soft);
      }
      .status-dots {
        display: flex;
        gap: 6px;
        margin-top: 12px;
      }
      .status-dots span {
        height: 4px;
        border-radius: 99px;
        background: var(--border);
        flex: 1;
        overflow: hidden;
        position: relative;
      }
      .status-dots span::after {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--fg-faint);
        transform: translateX(-100%);
        animation: slide 1.6s ease-in-out infinite;
      }
      .status-dots span:nth-child(2)::after {
        animation-delay: 0.2s;
      }
      .status-dots span:nth-child(3)::after {
        animation-delay: 0.4s;
      }
      @keyframes slide {
        50% {
          transform: translateX(100%);
        }
        100% {
          transform: translateX(100%);
        }
      }
      .error-card {
        border-color: color-mix(in srgb, var(--red) 30%, var(--border));
        background: var(--red-soft);
        color: var(--red);
      }
      .error-card strong {
        display: block;
        font-size: 14px;
      }
      .error-card p {
        margin: 4px 0 0;
        font-size: 13px;
        color: color-mix(in srgb, var(--red) 85%, var(--fg));
        word-break: break-word;
      }

      /* ---------- results ---------- */
      .results {
        padding: 56px 0 80px;
      }
      .result-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 24px;
        flex-wrap: wrap;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--border);
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: var(--mono);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--fg-faint);
        margin-bottom: 10px;
      }
      .eyebrow .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--green);
      }
      .result-head h2 {
        font-size: 30px;
        line-height: 1.15;
        letter-spacing: -0.03em;
        margin: 0 0 10px;
        font-weight: 620;
      }
      .result-head .summary {
        margin: 0;
        color: var(--fg-soft);
        max-width: 620px;
        font-size: 14px;
      }
      .head-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      button.ghost {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--fg-soft);
        font-size: 12.5px;
        padding: 7px 12px;
        border-radius: 8px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition:
          background 0.15s,
          color 0.15s,
          border-color 0.15s;
      }
      button.ghost:hover {
        background: var(--bg-soft);
        color: var(--fg);
        border-color: var(--border-strong);
      }
      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 18px;
      }
      .meta-row .chip {
        font-family: var(--mono);
        font-size: 11px;
      }

      .tabs {
        display: flex;
        gap: 4px;
        margin: 22px 0;
        padding: 4px;
        border: 1px solid var(--border);
        background: var(--bg-soft);
        border-radius: 10px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar {
        display: none;
      }
      .tab {
        flex: 1 0 auto;
        border: 0;
        background: transparent;
        color: var(--fg-soft);
        font-size: 13px;
        font-weight: 500;
        padding: 8px 14px;
        border-radius: 7px;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background 0.15s,
          color 0.15s,
          box-shadow 0.15s;
      }
      .tab:hover {
        color: var(--fg);
      }
      .tab[aria-selected="true"] {
        background: var(--panel);
        color: var(--fg);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      }
      .tab .count {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--fg-faint);
        margin-left: 4px;
      }

      .block + .block {
        margin-top: 28px;
      }
      .block-title {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--fg-faint);
        font-weight: 600;
        margin: 0 0 10px;
      }
      .block-title .note {
        text-transform: none;
        letter-spacing: 0;
        font-weight: 400;
        font-size: 12px;
      }
      p.body {
        margin: 0;
        font-size: 14px;
        color: var(--fg-soft);
        max-width: 720px;
      }

      .card {
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: var(--radius);
        padding: 16px;
      }
      .grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
      .grid.two {
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }
      .card h4 {
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .card p {
        margin: 0;
        font-size: 13px;
        color: var(--fg-soft);
      }
      .card .kicker {
        font-family: var(--mono);
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--fg-faint);
        margin-bottom: 8px;
      }
      .card .card-foot {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border: 1px solid var(--border);
        background: var(--bg-soft);
        color: var(--fg-soft);
        border-radius: 999px;
        padding: 3px 9px;
        font-size: 12px;
        line-height: 1.5;
      }
      .chip.solid {
        background: var(--fg);
        color: var(--bg);
        border-color: var(--fg);
      }
      .chip.green {
        background: var(--green-soft);
        color: var(--green);
        border-color: transparent;
      }
      .chip .num {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--fg-faint);
      }

      .table-wrap {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow-x: auto;
        background: var(--panel);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      th {
        text-align: left;
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--fg-faint);
        font-weight: 600;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
        background: var(--bg-soft);
      }
      td {
        padding: 13px 14px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
        color: var(--fg-soft);
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      tbody tr:hover td {
        background: var(--bg-soft);
      }
      td strong {
        color: var(--fg);
        font-weight: 550;
      }
      td .platforms {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }

      .kv {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 12px;
      }
      .kw-card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--panel);
        padding: 14px;
      }
      .kw-card.primary {
        background: var(--fg);
        color: var(--bg);
        border-color: var(--fg);
      }
      .kw-card.primary .kicker {
        color: color-mix(in srgb, var(--bg) 65%, transparent);
      }
      .kw-card.primary .keyword {
        color: var(--bg);
      }
      .kw-card .kicker {
        font-family: var(--mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--fg-faint);
        margin-bottom: 8px;
      }
      .kw-card .keyword {
        font-size: 15px;
        font-weight: 550;
        letter-spacing: -0.01em;
        word-break: break-word;
      }
      .kw-card.primary .keyword {
        font-size: 18px;
      }

      .seo-snippet {
        position: relative;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--panel);
        padding: 16px;
      }
      .seo-snippet .kicker {
        font-family: var(--mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--fg-faint);
        margin-bottom: 8px;
      }
      .seo-snippet .title-line {
        color: var(--blue);
        font-size: 16px;
        line-height: 1.4;
        margin-bottom: 2px;
      }
      .seo-snippet .desc-line {
        color: var(--fg-soft);
        font-size: 13px;
      }
      .seo-snippet .url-line {
        font-size: 12px;
        color: var(--green);
        font-family: var(--mono);
        margin-bottom: 4px;
      }
      .copy {
        position: absolute;
        top: 10px;
        right: 10px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--fg-faint);
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 6px;
        cursor: pointer;
      }
      .copy:hover {
        color: var(--fg);
        border-color: var(--border-strong);
      }

      .list {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 8px;
      }
      .list li {
        position: relative;
        padding-left: 18px;
        font-size: 13.5px;
        color: var(--fg-soft);
      }
      .list li::before {
        content: "";
        position: absolute;
        left: 2px;
        top: 8px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--border-strong);
      }
      .empty {
        border: 1px dashed var(--border-strong);
        border-radius: var(--radius);
        padding: 18px;
        color: var(--fg-faint);
        font-size: 13px;
        text-align: center;
      }
      .source {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--fg-faint);
      }

      .disclaimer {
        margin-top: 28px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        font-size: 11.5px;
        color: var(--fg-faint);
        max-width: 760px;
      }

      footer {
        border-top: 1px solid var(--border);
        padding: 22px 0 40px;
      }
      footer .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--fg-faint);
      }
      footer a {
        color: var(--fg-soft);
        text-decoration: none;
      }
      footer a:hover {
        color: var(--fg);
        text-decoration: underline;
      }

      @media (max-width: 640px) {
        .hero {
          padding-top: 48px;
        }
        form.search {
          flex-direction: column;
          padding: 8px;
        }
        .field {
          padding: 4px 6px;
        }
        button.primary {
          justify-content: center;
          height: 44px;
        }
        .result-head {
          flex-direction: column;
        }
        .result-head h2 {
          font-size: 24px;
        }
        th,
        td {
          padding: 10px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
        html {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero wrap">
        <form class="search" id="form" novalidate>
          <div class="field">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <circle
                cx="12"
                cy="12"
                r="9"
                stroke="currentColor"
                stroke-width="1.6"
              />
              <path
                d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"
                stroke="currentColor"
                stroke-width="1.4"
              />
            </svg>
            <input
              id="url"
              name="url"
              type="text"
              inputmode="url"
              autocomplete="url"
              spellcheck="false"
              placeholder="example.com"
              aria-label="Website URL"
              required
            />
          </div>
          <button class="primary" id="submit" type="submit">
            Analyze
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M5 12h14M13 6l6 6-6 6"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </form>

        <div class="examples">
          Try
          <button type="button" data-url="https://stripe.com">
            stripe.com
          </button>
          ·
          <button type="button" data-url="https://vercel.com">
            vercel.com
          </button>
          ·
          <button type="button" data-url="https://www.notion.so">
            notion.so
          </button>
        </div>

        <div class="alert hidden" id="alert" role="status">
          <span aria-hidden="true">⚠</span>
          <div>
            <strong>Groq API key is not configured.</strong>
            Add <code>GROQ_API_KEY</code> to <code>.env</code> in the project
            root, then restart the server. Get a key at
            <a
              href="https://console.groq.com/keys"
              target="_blank"
              rel="noopener"
              >console.groq.com/keys</a
            >.
          </div>
        </div>
      </section>

      <section class="wrap" aria-live="polite">
        <div class="status-card hidden" id="status">
          <div class="spinner" aria-hidden="true"></div>
          <div style="flex: 1">
            <strong id="status-title">Fetching the page…</strong>
            <p id="status-sub">
              Downloading HTML and removing navigation noise.
            </p>
            <div class="status-dots" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
          </div>
        </div>

        <div class="error-card hidden" id="error" role="alert">
          <span aria-hidden="true">✕</span>
          <div>
            <strong>Analysis failed</strong>
            <p id="error-message"></p>
          </div>
        </div>
      </section>

      <section class="results wrap hidden" id="results">
        <div class="result-head">
          <div>
            <div class="eyebrow">
              <span class="dot"></span> <span id="site"></span>
            </div>
            <h2 id="brand-name"></h2>
            <p class="summary" id="brand-summary"></p>
            <div class="meta-row" id="meta-row"></div>
          </div>
          <div class="head-actions">
            <button class="ghost" id="copy-json" type="button">
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <rect
                  x="9"
                  y="9"
                  width="12"
                  height="12"
                  rx="2"
                  stroke="currentColor"
                  stroke-width="1.7"
                />
                <path
                  d="M15 5H5a2 2 0 0 0-2 2v10"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />
              </svg>
              Copy JSON
            </button>
            <button class="ghost" id="reset" type="button">New analysis</button>
          </div>
        </div>

        <div class="tabs" role="tablist" aria-label="Analysis sections">
          <button
            class="tab"
            role="tab"
            data-tab="competitors"
            aria-selected="true"
          >
            Competitors <span class="count" data-count="competitors"></span>
          </button>
          <button
            class="tab"
            role="tab"
            data-tab="queries"
            aria-selected="false"
          >
            Search queries <span class="count" data-count="queries"></span>
          </button>
          <button class="tab" role="tab" data-tab="seo" aria-selected="false">
            SEO
          </button>
          <button
            class="tab"
            role="tab"
            data-tab="services"
            aria-selected="false"
          >
            Services <span class="count" data-count="services"></span>
          </button>
          <button
            class="tab"
            role="tab"
            data-tab="audience"
            aria-selected="false"
          >
            Audience
          </button>
        </div>

        <div id="panel" role="tabpanel"></div>

        <p class="disclaimer" id="disclaimer"></p>
      </section>
    </main>

    <script>
      (function () {
        "use strict";

        const $ = (id) => document.getElementById(id);

        // The UI is normally served by FastAPI on :4000. When it is opened through a
        // static server (e.g. VS Code Live Server on :5500) relative requests would hit
        // that static server and fail with 405, so talk to the API on :4000 instead.
        const API_BASE = (() => {
          if (window.LINK_ANALYSIS_API_BASE)
            return String(window.LINK_ANALYSIS_API_BASE).replace(/\/$/, "");
          if (location.protocol === "file:") return "http://localhost:4000";
          if (!location.port || location.port === "4000") return "";
          return `${location.protocol}//${location.hostname}:4000`;
        })();
        const api = (path) => `${API_BASE}${path}`;

        document.querySelectorAll("a[data-api-path]").forEach((link) => {
          link.href = api(link.dataset.apiPath);
        });

        const form = $("form");
        const input = $("url");
        const submitBtn = $("submit");
        const alertBox = $("alert");
        const statusBox = $("status");
        const errorBox = $("error");
        const results = $("results");
        const panel = $("panel");

        const state = { data: null, tab: "competitors", timers: [] };

        const esc = (value) =>
          String(value ?? "").replace(
            /[&<>"']/g,
            (ch) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[ch],
          );

        const arr = (value) => (Array.isArray(value) ? value : []);

        const chips = (items, className = "") => {
          const list = arr(items).filter(
            (item) =>
              item !== null && item !== undefined && String(item).trim(),
          );
          if (!list.length) return `<span class="empty">Not available</span>`;
          return `<div class="chips">${list
            .map(
              (item) => `<span class="chip ${className}">${esc(item)}</span>`,
            )
            .join("")}</div>`;
        };

        const bullets = (items) => {
          const list = arr(items).filter(Boolean);
          if (!list.length)
            return `<p class="body">Not available in this analysis.</p>`;
          return `<ul class="list">${list.map((item) => `<li>${esc(item)}</li>`).join("")}</ul>`;
        };

        const block = (title, content, note = "") =>
          `<div class="block"><h3 class="block-title">${esc(title)}${note ? `<span class="note">${esc(note)}</span>` : ""}</h3>${content}</div>`;

        const clearTimers = () => {
          state.timers.forEach((timer) => clearTimeout(timer));
          state.timers = [];
        };

        const setLoading = (loading) => {
          submitBtn.disabled = loading;
          input.disabled = loading;
          if (loading) {
            errorBox.classList.add("hidden");
            results.classList.add("hidden");
            statusBox.classList.remove("hidden");
            $("status-title").textContent = "Fetching the page…";
            $("status-sub").textContent =
              "Downloading HTML and removing navigation noise.";
            clearTimers();
            state.timers.push(
              setTimeout(() => {
                $("status-title").textContent = "Analyzing with Groq…";
                $("status-sub").textContent =
                  "Building competitors, queries, SEO and audience insights.";
              }, 1600),
            );
          } else {
            statusBox.classList.add("hidden");
            clearTimers();
          }
        };

        const showError = (message) => {
          setLoading(false);
          results.classList.add("hidden");
          $("error-message").textContent = message;
          errorBox.classList.remove("hidden");
        };

        const meta = (data) => {
          const m = data.meta || {};
          const items = [
            m.model ? `model ${m.model}` : "",
            m.input_tokens ? `${m.input_tokens.toLocaleString()} in` : "",
            m.output_tokens ? `${m.output_tokens.toLocaleString()} out` : "",
            m.response_ms ? `${(m.response_ms / 1000).toFixed(1)}s` : "",
            m.extracted_characters
              ? `${m.extracted_characters.toLocaleString()} chars`
              : "",
          ].filter(Boolean);
          return items
            .map((text) => `<span class="chip">${esc(text)}</span>`)
            .join("");
        };

        function renderCompetitors(a) {
          const c = a.competitor_analysis || {};
          const competitors = arr(c.competitors);
          const rows = competitors
            .map(
              (item) => `
      <tr>
        <td><strong>${esc(item.name)}</strong>${item.basis ? `<div class="source">${esc(item.basis)}</div>` : ""}</td>
        <td>${esc(item.main_service || "—")}</td>
        <td>${esc(item.target_market || "—")}</td>
        <td>${esc(item.key_strength || "—")}</td>
        <td>${esc(item.weakness_or_gap || "—")}</td>
        <td>${esc(item.opportunity || "—")}</td>
      </tr>`,
            )
            .join("");

          const table = competitors.length
            ? `<div class="table-wrap"><table>
          <thead><tr><th>Competitor</th><th>Main service</th><th>Target market</th><th>Key strength</th><th>Gap / weakness</th><th>Your opportunity</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>`
            : `<div class="empty">No reliable competitors could be identified from the page content.</div>`;

          return [
            block(
              "Brand overview",
              `<p class="body">${esc(c.brand_overview || "—")}</p>`,
            ),
            c.products_and_services && c.products_and_services.length
              ? block(
                  "Products & services mentioned",
                  chips(c.products_and_services),
                )
              : "",
            block(
              "Competitor comparison",
              table,
              "AI-generated suggestions — verify before use",
            ),
            `<div class="grid">${[
              ["Your advantages", c.competitive_advantages],
              ["Your strengths", c.strengths],
              ["Opportunities", c.opportunities],
            ]
              .map(
                ([title, items]) =>
                  `<div class="card"><div class="kicker">${esc(title)}</div>${bullets(items)}</div>`,
              )
              .join("")}</div>`,
          ].join("");
        }

        function renderQueries(a) {
          const queries = arr(a.target_search_queries);
          if (!queries.length)
            return block(
              "Top search queries",
              `<div class="empty">No queries were returned.</div>`,
            );

          const rows = queries
            .map(
              (item, index) => `
      <tr>
        <td><span class="chip"><span class="num">${index + 1}</span></span></td>
        <td><strong>${esc(item.query)}</strong><div class="source">${esc(item.business_relevance || "")}</div></td>
        <td><div class="platforms">${
          arr(item.platforms)
            .map((p) => `<span class="chip">${esc(p)}</span>`)
            .join("") || "—"
        }</div></td>
        <td>${esc(item.intent || "—")}</td>
        <td>${esc(item.target_audience || "—")}</td>
      </tr>`,
            )
            .join("");

          return [
            block(
              "Top 5 target search queries",
              `<div class="table-wrap"><table>
        <thead><tr><th>#</th><th>Query & relevance</th><th>Platforms</th><th>Intent</th><th>Audience</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`,
            ),
            `<p class="disclaimer" style="margin-top:12px;border:0;padding:0">No search volumes or ranking data are claimed — these are query suggestions, not measured metrics.</p>`,
          ].join("");
        }

        function renderSeo(a) {
          const seo = a.seo_improvements || {};
          const snippet = `
      <div class="seo-snippet">
        <button class="copy" type="button" data-copy="${esc(seo.recommended_title || "")}">Copy title</button>
        <div class="kicker">Search preview</div>
        <div class="url-line">example.com</div>
        <div class="title-line">${esc(seo.recommended_title || "Add a recommended title")}</div>
        <div class="desc-line">${esc(seo.meta_description || "Add a meta description.")}</div>
      </div>`;

          return [
            block(
              "Keyword recommendations",
              `<div class="kv">
        <div class="kw-card primary"><div class="kicker">Primary keyword</div><div class="keyword">${esc(seo.primary_keyword || "—")}</div></div>
        <div class="kw-card"><div class="kicker">Secondary</div>${chips(seo.secondary_keywords)}</div>
        <div class="kw-card"><div class="kicker">Long-tail</div>${chips(seo.long_tail_keywords)}</div>
        <div class="kw-card"><div class="kicker">Business keywords</div>${chips(seo.business_keywords)}</div>
      </div>`,
            ),
            block("SEO title & meta description", snippet),
            block(
              "Supporting content to publish",
              bullets(seo.supporting_content),
            ),
          ].join("");
        }

        function renderServices(a) {
          const services = arr(a.top_services);
          if (!services.length)
            return block(
              "Top services",
              `<div class="empty">No services were returned.</div>`,
            );

          const cards = services
            .map(
              (item) => `
      <div class="card">
        <div class="kicker">${esc(item.source || "inferred")}</div>
        <h4>${esc(item.name)}</h4>
        <p>${esc(item.description || "—")}</p>
        <div class="card-foot">
          ${item.target_industry ? `<span class="chip">${esc(item.target_industry)}</span>` : ""}
          ${item.target_customer ? `<span class="chip">${esc(item.target_customer)}</span>` : ""}
        </div>
        ${item.main_benefit ? `<p style="margin-top:10px"><strong style="color:var(--fg);font-weight:550">Benefit:</strong> ${esc(item.main_benefit)}</p>` : ""}
      </div>`,
            )
            .join("");

          return block(
            "Top 5 services",
            `<div class="grid two">${cards}</div>`,
            "labelled from page content or inferred",
          );
        }

        function renderAudience(a) {
          const t = a.target_audience || {};
          const section = (title, value, className = "") =>
            `<div class="card"><div class="kicker">${esc(title)}</div>${chips(value, className)}</div>`;

          return [
            block(
              "Primary & secondary audiences",
              `<div class="grid two">
        ${section("Primary audience", t.primary_audience, "solid")}
        ${section("Secondary audience", t.secondary_audience)}
      </div>`,
            ),
            block(
              "Segments & industries",
              `<div class="grid two">
        ${section("Industries", t.industries)}
        ${section("Business types", t.business_types)}
        ${section("Customer profiles", t.customer_profiles)}
        ${section("Customer interests", t.customer_interests)}
      </div>`,
            ),
            block("Needs & challenges", bullets(t.customer_needs)),
            block(
              "Recommended marketing segments",
              chips(t.recommended_segments, "green"),
            ),
            t.location_focus
              ? block(
                  "Geographic focus",
                  `<p class="body">${esc(t.location_focus)}</p>`,
                )
              : "",
          ].join("");
        }

        function renderPanel() {
          if (!state.data) return;
          const a = state.data.analysis || {};
          const renderers = {
            competitors: renderCompetitors,
            queries: renderQueries,
            seo: renderSeo,
            services: renderServices,
            audience: renderAudience,
          };
          panel.innerHTML = (renderers[state.tab] || renderCompetitors)(a);
        }

        function render(data) {
          state.data = data;
          state.tab = "competitors";

          $("site").textContent = (data.website || "")
            .replace(/^https?:\/\//, "")
            .replace(/\/$/, "");
          $("brand-name").textContent =
            (data.brand && data.brand.name) || "Website analysis";
          $("brand-summary").textContent =
            (data.brand && data.brand.summary) ||
            (data.analysis &&
              data.analysis.competitor_analysis &&
              data.analysis.competitor_analysis.brand_overview) ||
            "";
          $("meta-row").innerHTML = meta(data);
          $("disclaimer").textContent = data.disclaimer || "";

          const a = data.analysis || {};
          const counts = {
            competitors: arr(
              a.competitor_analysis && a.competitor_analysis.competitors,
            ).length,
            queries: arr(a.target_search_queries).length,
            services: arr(a.top_services).length,
          };
          Object.entries(counts).forEach(([key, value]) => {
            const el = document.querySelector(`[data-count="${key}"]`);
            if (el) el.textContent = value ? value : "";
          });

          document.querySelectorAll(".tab").forEach((tab) => {
            tab.setAttribute(
              "aria-selected",
              String(tab.dataset.tab === state.tab),
            );
          });

          errorBox.classList.add("hidden");
          results.classList.remove("hidden");
          renderPanel();
        }

        async function run(rawUrl) {
          const url = (rawUrl || input.value || "").trim();
          if (!url) {
            input.focus();
            input.reportValidity && input.reportValidity();
            return;
          }
          input.value = url;
          setLoading(true);

          try {
            const response = await fetch(api("/link-analysis"), {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ url }),
            });
            const body = await response.json().catch(() => null);

            if (!response.ok) {
              const detail = body && body.detail;
              const message = Array.isArray(detail)
                ? detail.map((d) => d.msg || d).join("; ")
                : detail ||
                  (body && body.error) ||
                  `Request failed with HTTP ${response.status}.`;
              showError(message);
              if (response.status === 503) alertBox.classList.remove("hidden");
              return;
            }

            setLoading(false);
            render(body);
            results.scrollIntoView({ behavior: "smooth", block: "start" });
          } catch (err) {
            showError(
              `Could not reach the API at ${API_BASE || "this origin"}. Is the FastAPI server still running on port 4000?`,
            );
          }
        }

        form.addEventListener("submit", (event) => {
          event.preventDefault();
          run();
        });

        document.querySelectorAll("[data-url]").forEach((button) => {
          button.addEventListener("click", () => {
            input.value = button.dataset.url;
            run(button.dataset.url);
          });
        });

        document.querySelectorAll(".tab").forEach((tab) => {
          tab.addEventListener("click", () => {
            state.tab = tab.dataset.tab;
            document
              .querySelectorAll(".tab")
              .forEach((item) =>
                item.setAttribute("aria-selected", String(item === tab)),
              );
            renderPanel();
          });
        });

        $("reset").addEventListener("click", () => {
          state.data = null;
          results.classList.add("hidden");
          errorBox.classList.add("hidden");
          input.value = "";
          input.focus();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });

        $("copy-json").addEventListener("click", async (event) => {
          const button = event.currentTarget;
          const original = button.innerHTML;
          try {
            await navigator.clipboard.writeText(
              JSON.stringify(state.data, null, 2),
            );
          } catch (err) {
            const area = document.createElement("textarea");
            area.value = JSON.stringify(state.data, null, 2);
            document.body.appendChild(area);
            area.select();
            document.execCommand("copy");
            area.remove();
          }
          button.innerHTML = "Copied";
          setTimeout(() => {
            button.innerHTML = original;
          }, 1400);
        });

        document.addEventListener("click", async (event) => {
          const button = event.target.closest("[data-copy]");
          if (!button) return;
          try {
            await navigator.clipboard.writeText(button.dataset.copy || "");
            const original = button.textContent;
            button.textContent = "Copied";
            setTimeout(() => {
              button.textContent = original;
            }, 1200);
          } catch (err) {
            /* clipboard unavailable */
          }
        });

        fetch(api("/health"))
          .then((response) => response.json())
          .then((health) => {
            if (health && health.groq_configured === false)
              alertBox.classList.remove("hidden");
          })
          .catch(() => {});
      })();
    </script>
  </body>
</html>
